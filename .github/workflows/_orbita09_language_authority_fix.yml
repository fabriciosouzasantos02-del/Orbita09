name: Orbita09 language authority fix

on:
  push:
    branches: [fix/global-user-language-authority]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-user-language-authority
          fetch-depth: 0
      - name: Apply language-authority patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          t = p.read_text(encoding='utf-8')
          old = """  if (!rawLang) {\n    const acceptLang = req.headers['accept-language'];\n    if (typeof acceptLang === 'string') {\n      rawLang = acceptLang.split(',')[0].split(';')[0].trim();\n    }\n  }\n  \n"""
          if old not in t:
              raise SystemExit('global Accept-Language fallback not found')
          t = t.replace(old, """  // The application language is controlled exclusively by the user's explicit\n  // selection in the app (or an app-provided language value). Never infer\n  // application content language from the browser/OS Accept-Language header.\n  \n""", 1)
          old2 = "((lang || req.headers['accept-language'] || 'pt') as string).toLowerCase().split('-')[0]"
          if t.count(old2) != 4:
              raise SystemExit(f'expected 4 endpoint fallbacks, found {t.count(old2)}')
          t = t.replace(old2, "normalizeLang(lang || (req as any).lang || 'pt')")
          old3 = """  if (!text) {\n    text = mergedTranslations['pt']?.[key] || (translations['pt'] as any)?.[key];\n  }\n  if (!text) {\n    return key;\n  }\n"""
          if old3 not in t:
              raise SystemExit('Portuguese translation fallback not found')
          t = t.replace(old3, """  if (!text) {\n    // Do not silently fall back to Portuguese. Missing translations must be\n    // visible to validation instead of violating the user's active language.\n    return key;\n  }\n""", 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate language authority patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('server.ts').read_text(encoding='utf-8')
          assert "req.headers['accept-language']" not in t, 'Accept-Language still controls server language'
          assert "mergedTranslations['pt']?.[key]" not in t, 'Portuguese translation fallback still exists'
          assert t.count("normalizeLang(lang || (req as any).lang || 'pt')") == 4, 'Expected 4 endpoint language resolutions'
          assert "req.lang = resolvedLang" in t, 'Global resolved app language middleware missing'
          print('Language-authority validation passed')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git diff --cached --quiet || git commit -m "fix: make app language authoritative on backend"
          git push origin fix/global-user-language-authority
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/_orbita09_language_authority_fix.yml
          git add .github/workflows/_orbita09_language_authority_fix.yml
          git commit -m "chore: remove temporary language fix workflow"
          git push origin fix/global-user-language-authority
