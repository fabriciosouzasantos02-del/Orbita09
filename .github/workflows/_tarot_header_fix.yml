name: Tarot header repair
on:
  push:
    paths:
      - '.github/workflows/_tarot_header_fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-user-language-authority
          fetch-depth: 0
      - name: Patch and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/TarotSystem.tsx')
          s=p.read_text(encoding='utf-8')
          start=s.index("fetch('/api/tarot/interpret', {")
          end=s.index("        body: JSON.stringify({", start)
          old="        headers: { 'Content-Type': 'application/json' },\n"
          pos=s.index(old, start, end)
          new="        headers: {\n          'Content-Type': 'application/json',\n          'X-App-Lang': lang || 'pt'\n        },\n"
          s=s[:pos]+new+s[pos+len(old):]
          p.write_text(s, encoding='utf-8')
          PY
          grep -n "X-App-Lang.*lang" src/TarotSystem.tsx
          git diff --check
          git config user.name 'orbita-i18n-bot'
          git config user.email 'orbita-i18n-bot@users.noreply.github.com'
          git add src/TarotSystem.tsx
          git commit -m 'fix: send selected app language with tarot interpretation'
          git push origin HEAD:fix/global-user-language-authority
