name: Planetas navigation hotfix v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          marker = "  const [activeTab, setActiveTab] = useState<'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes'>('mapa');"
          if "navigationIntentRef" not in s:
              s = s.replace(marker, marker + "\n  const navigationIntentRef = useRef<'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes' | null>(null);\n  const navigateToTab = (tab: 'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes') => { navigationIntentRef.current = tab; setActiveTab(tab); };", 1)
          old = """      // Navigate to correct tab
      if (updatedUser.hasCreatedMap || (updatedUser.birthDate && updatedUser.birthCity)) {
        setMapSubTab('meu_mapa');
        setActiveTab('mapa');
      } else {
        setMapSubTab('criar_meu_mapa');
        setActiveTab('mapa');
      }"""
          new = """      // Preserve a tab explicitly chosen while session synchronization was running.
      const requestedTab = navigationIntentRef.current;
      if (requestedTab) {
        setActiveTab(requestedTab);
        navigationIntentRef.current = null;
      } else if (updatedUser.hasCreatedMap || (updatedUser.birthDate && updatedUser.birthCity)) {
        setMapSubTab('meu_mapa');
        setActiveTab('mapa');
      } else {
        setMapSubTab('criar_meu_mapa');
        setActiveTab('mapa');
      }"""
          if old not in s:
              raise SystemExit('Primary sync navigation block not found')
          s = s.replace(old, new, 1)
          for old, new in {
              "onClick={() => setActiveTab('constelacoes')}": "onClick={() => navigateToTab('constelacoes')}",
              "onClick={() => setActiveTab('planetas')}": "onClick={() => navigateToTab('planetas')}",
              "onClick={() => setActiveTab('tarot')}": "onClick={() => navigateToTab('tarot')}",
              "onClick={() => setActiveTab('configuracoes')}": "onClick={() => navigateToTab('configuracoes')}",
          }.items():
              s = s.replace(old, new, 1)
          old = """onClick={() => {
                setActiveTab('mapa');
                if (!isPremiumActive && mapSubTab !== 'meu_mapa' && mapSubTab !== 'criar_meu_mapa') {"""
          new = """onClick={() => {
                navigateToTab('mapa');
                if (!isPremiumActive && mapSubTab !== 'meu_mapa' && mapSubTab !== 'criar_meu_mapa') {"""
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet || git commit -m 'fix(planets): preserve navigation during session sync'
          git push origin main
