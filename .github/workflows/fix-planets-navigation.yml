name: Apply Planetas navigation hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: preserve Planetas navigation during session sync') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.tsx safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old = """  const [activeTab, setActiveTab] = useState<'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes'>('mapa');\n  const [showDeleteConfirm, setShowDeleteConfirm] = useState<boolean>(false);"""
          new = """  const [activeTab, setActiveTab] = useState<'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes'>('mapa');\n  // Preserve an explicit user navigation choice while authentication/session sync finishes.\n  const navigationIntentRef = useRef<'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes' | null>(null);\n  const navigateToTab = (tab: 'mapa' | 'constelacoes' | 'planetas' | 'tarot' | 'configuracoes') => {\n    navigationIntentRef.current = tab;\n    setActiveTab(tab);\n  };\n  const [showDeleteConfirm, setShowDeleteConfirm] = useState<boolean>(false);"""
          if old not in text:
              raise SystemExit('Navigation state block not found; refusing to patch.')
          text = text.replace(old, new, 1)

          old = """      // Navigate to correct tab\n      if (updatedUser.hasCreatedMap || (updatedUser.birthDate && updatedUser.birthCity)) {\n        setMapSubTab('meu_mapa');\n        setActiveTab('mapa');\n      } else {\n        setMapSubTab('criar_meu_mapa');\n        setActiveTab('mapa');\n      }"""
          new = """      // Do not overwrite a tab explicitly selected by the user while sync was running.\n      const requestedTab = navigationIntentRef.current;\n      if (requestedTab) {\n        setActiveTab(requestedTab);\n        navigationIntentRef.current = null;\n      } else if (updatedUser.hasCreatedMap || (updatedUser.birthDate && updatedUser.birthCity)) {\n        setMapSubTab('meu_mapa');\n        setActiveTab('mapa');\n      } else {\n        setMapSubTab('criar_meu_mapa');\n        setActiveTab('mapa');\n      }"""
          if old not in text:
              raise SystemExit('Primary session navigation block not found; refusing to patch.')
          text = text.replace(old, new, 1)

          old = """            if (parsed.hasCreatedMap) {\n              setMapSubTab('meu_mapa');\n              setActiveTab('mapa');\n              triggerGenerateMainMap(parsed);\n            } else {\n              setMapSubTab('criar_meu_mapa');\n              setActiveTab('mapa');\n            }"""
          new = """            const requestedTab = navigationIntentRef.current;\n            if (requestedTab) {\n              setActiveTab(requestedTab);\n              navigationIntentRef.current = null;\n            } else if (parsed.hasCreatedMap) {\n              setMapSubTab('meu_mapa');\n              setActiveTab('mapa');\n              triggerGenerateMainMap(parsed);\n            } else {\n              setMapSubTab('criar_meu_mapa');\n              setActiveTab('mapa');\n            }"""
          if old not in text:
              raise SystemExit('Fallback session navigation block not found; refusing to patch.')
          text = text.replace(old, new, 1)

          replacements = {
              "onClick={() => setActiveTab('constelacoes')}": "onClick={() => navigateToTab('constelacoes')}",
              "onClick={() => setActiveTab('planetas')}": "onClick={() => navigateToTab('planetas')}",
              "onClick={() => setActiveTab('tarot')}": "onClick={() => navigateToTab('tarot')}",
              "onClick={() => setActiveTab('configuracoes')}": "onClick={() => navigateToTab('configuracoes')}",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Bottom navigation handler not found: {old}')
              text = text.replace(old, new, 1)

          old = """onClick={() => {\n                setActiveTab('mapa');\n                if (!isPremiumActive && mapSubTab !== 'meu_mapa' && mapSubTab !== 'criar_meu_mapa') {"""
          new = """onClick={() => {\n                navigateToTab('mapa');\n                if (!isPremiumActive && mapSubTab !== 'meu_mapa' && mapSubTab !== 'criar_meu_mapa') {"""
          if old not in text:
              raise SystemExit('Bottom map navigation handler not found.')
          text = text.replace(old, new, 1)

          nav_start = text.index('{/* ========================================= */}\n          {/* BOTTOM FLOATING NAV BAR')
          nav_end = text.index('</nav>', nav_start)
          nav = text[nav_start:nav_end].replace('<button\n', '<button type="button"\n')
          text = text[:nav_start] + nav + text[nav_end:]

          path.write_text(text, encoding='utf-8')

      - name: Commit hotfix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/fix-planets-navigation.yml
          git commit -m "fix: preserve Planetas navigation during session sync"
          git push origin main
