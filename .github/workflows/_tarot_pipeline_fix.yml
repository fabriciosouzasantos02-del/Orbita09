name: Tarot pipeline repair

on:
  push:
    paths:
      - '.github/workflows/_tarot_pipeline_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/global-user-language-authority
          fetch-depth: 0

      - name: Verify and complete Tarot locale transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tarot = Path('src/TarotSystem.tsx')
          text = tarot.read_text(encoding='utf-8')

          endpoint = "fetch('/api/tarot/interpret', {"
          start = text.index(endpoint)
          body_start = text.index("        body: JSON.stringify({", start)
          header_segment = text[start:body_start]
          if "X-App-Lang" not in header_segment:
              old = "        headers: { 'Content-Type': 'application/json' },\n"
              pos = text.index(old, start, body_start)
              new = "        headers: {\n          'Content-Type': 'application/json',\n          'X-App-Lang': lang || 'pt'\n        },\n"
              text = text[:pos] + new + text[pos + len(old):]

          tarot.write_text(text, encoding='utf-8')
          PY

      - name: Static verification
        shell: bash
        run: |
          grep -n "const cardsListStr" server.ts
          grep -n "X-App-Lang.*lang" src/TarotSystem.tsx
          grep -n "fallbackByLanguage" src/TarotSystem.tsx
          if grep -n "req.headers\['accept-language'\]" server.ts; then
            echo 'Unexpected Accept-Language authority remains in server.ts'
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Validate i18n
        run: npm run validate-i18n

      - name: Build application
        run: npm run build

      - name: Commit Tarot repair
        shell: bash
        run: |
          git config user.name 'orbita-i18n-bot'
          git config user.email 'orbita-i18n-bot@users.noreply.github.com'
          git add server.ts src/TarotSystem.tsx
          if git diff --cached --quiet; then
            echo 'No additional Tarot changes were necessary.'
          else
            git commit -m 'fix: complete tarot interpretation locale transport'
            git push origin HEAD:fix/global-user-language-authority
          fi
